<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>garage2AFH — 전체 프로젝트 갤러리</title>
<style>
  :root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f8fafc;--accent:#0b5fff;--red:#d92d20;--ok:#067647}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
  header{padding:44px 20px 30px;background:#fff;border-bottom:1px solid var(--line)}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}
  .lead{font-size:16px;color:var(--muted);max-width:700px;margin:0}
  .back{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--muted);text-decoration:none;font-weight:600}
  .back:hover{color:var(--accent)}
  main{padding:26px 20px 70px}

  /* summary strip */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 26px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block}
  .stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
  .stat .v.sm{font-size:15px;letter-spacing:0;line-height:1.35}
  .stat .s{font-size:12px;color:var(--muted)}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;transition:.15s}
  .card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(11,95,255,.08)}
  .card .tag{font-size:11px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
  .card h3{margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
  .card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.8px;margin:0 0 14px}
  .rows dt{color:var(--muted)}
  .rows dd{margin:0;font-variant-numeric:tabular-nums}
  .rows dd b{font-weight:600}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .btn{display:inline-block;text-decoration:none;padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid transparent}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.94)}
  .btn.ghost{background:#fff;color:var(--accent);border-color:#c7d7fe}
  .btn.ghost:hover{background:#eff5ff}
  .btn.off{background:#f2f4f7;color:var(--muted);border-color:var(--line);cursor:not-allowed}
  .warn{display:inline-block;font-size:11.5px;color:var(--red);background:#fef3f2;border:1px solid #fecdca;border-radius:999px;padding:2px 9px;margin-bottom:10px;font-weight:600}
  .ok{color:var(--ok);font-weight:600}
  .msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;font-size:14px;color:var(--muted)}
  .msg a{color:var(--accent);font-weight:600;text-decoration:none}
  footer{border-top:1px solid var(--line);padding:22px 20px;color:var(--muted);font-size:12.5px;background:#fff}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
  @media (max-width:560px){
    header{padding:30px 16px 22px}
    h1{font-size:24px}
    main{padding:20px 16px 56px}
    .grid{grid-template-columns:1fr}
    .stat .v{font-size:21px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="index.html">&larr; garage2AFH</a>
    <h1>전체 프로젝트 갤러리</h1>
    <p class="lead">지금까지 만든 차고→AFH 전환 패키지 전부. 카드마다 최종 마스터 PDF로 바로 들어갑니다.</p>
  </div>
</header>

<main class="wrap">
  <div class="summary" id="summary" hidden></div>
  <div class="grid" id="grid">
    <p class="msg" id="loading">projects.json 을 읽는 중…</p>
  </div>
</main>

<footer>
  <div class="wrap">
    garage2AFH · MIT · <a href="https://github.com/henrynkoh/garage2afh_ai">henrynkoh/garage2afh_ai</a>
    · 이 페이지는 <code>g2a.py publish-index</code> 가 만든 <code>projects.json</code> 을 그대로 읽습니다. 빌드 단계 없음.
  </div>
</footer>

<script>
(function(){
  var grid = document.getElementById("grid");
  var summary = document.getElementById("summary");

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (txt !== undefined && txt !== null) { n.textContent = txt; }
    return n;
  }

  /* relative pdf path -> browser-safe url (spaces, parentheses in the original filenames) */
  function pdfUrl(p){
    return p.split("/").map(encodeURIComponent).join("/");
  }

  function fmt(n){ return (typeof n === "number" ? n : 0).toLocaleString("en-US"); }

  function shortDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? m[1] + "-" + m[2] + "-" + m[3] : "—";
  }

  function shortRange(ds){
    if (!ds.length) { return "—"; }
    var a = shortDate(ds[0]), b = shortDate(ds[ds.length - 1]);
    if (a === b) { return a; }
    return a.slice(0, 4) === b.slice(0, 4) ? a + " ~ " + b.slice(5) : a + " ~ " + b;
  }

  /* A PDF counts as uploaded only when the host answers it. file:// or a blocked
     HEAD just means "cannot tell", and then we keep the link (never a silent 404 menu). */
  function probe(url){
    if (!/^https?:$/.test(location.protocol) || !window.fetch) { return Promise.resolve(true); }
    return fetch(url, {method:"HEAD", cache:"no-store"}).then(function(r){
      return r.ok || r.status === 206;
    }).catch(function(){ return true; });
  }

  function card(p, available){
    var c = el("article", "card");
    c.appendChild(el("span", "tag", p.jurisdiction ? p.jurisdiction.split(" (")[0] : "프로젝트"));
    c.appendChild(el("h3", null, p.address));
    c.appendChild(el("p", "sub", [p.city, p.year_built ? p.year_built + "년" : ""].filter(Boolean).join(" · ")));

    if (!available) { c.appendChild(el("span", "warn", "PDF 미업로드")); }

    var dl = el("dl", "rows");
    function row(k, v){
      dl.appendChild(el("dt", null, k));
      var dd = el("dd");
      if (v && v.nodeType) { dd.appendChild(v); } else { dd.textContent = v; }
      dl.appendChild(dd);
    }
    row("프로그램", p.program || "—");
    row("차고", [p.garage_type, p.garage_sf ? p.garage_sf + " SF" : ""].filter(Boolean).join(" · ") || "—");
    var cnt = el("dd");
    cnt.innerHTML = "<b>" + fmt(p.sheets) + "</b>장 · <b>" + fmt(p.pages) + "</b>쪽";
    row("도면", cnt);
    var aud = el("dd");
    aud.innerHTML = p.audit ? '<span class="ok">' + p.audit + "</span>" : "—";
    row("자동검사", aud);
    if (p.parcel) { row("Parcel", p.parcel); }
    row("빌드", shortDate(p.built));
    c.appendChild(dl);

    var act = el("div", "actions");
    if (available && p.pdf) {
      var view = el("a", "btn primary", "도면 보기");
      view.href = "package.html?doc=" + encodeURIComponent(p.pdf) +
                  "&title=" + encodeURIComponent(p.address) +
                  "&pages=" + encodeURIComponent(p.pages || "");
      act.appendChild(view);
      var open = el("a", "btn ghost", "PDF 열기");
      open.href = pdfUrl(p.pdf);
      open.target = "_blank";
      open.rel = "noopener";
      act.appendChild(open);
    } else {
      act.appendChild(el("span", "btn off", "도면 보기"));
      act.appendChild(el("span", "btn off", "PDF 열기"));
    }
    c.appendChild(act);
    return c;
  }

  function fail(text, linkHref, linkText){
    grid.innerHTML = "";
    var m = el("p", "msg", text + " ");
    if (linkHref) {
      var a = el("a", null, linkText);
      a.href = linkHref;
      m.appendChild(a);
    }
    grid.appendChild(m);
  }

  fetch("projects.json", {cache:"no-store"})
    .then(function(r){
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(function(list){
      if (!Array.isArray(list) || !list.length) { throw new Error("empty"); }

      list = list.slice().sort(function(a, b){
        return String(b.built || "").localeCompare(String(a.built || ""));
      });

      var sheets = 0, pages = 0, dates = [];
      list.forEach(function(p){
        sheets += (p.sheets || 0);
        pages += (p.pages || 0);
        if (p.built) { dates.push(String(p.built)); }
      });
      dates.sort();

      summary.innerHTML = "";
      [
        ["프로젝트", String(list.length), "완성된 패키지"],
        ["총 도면", fmt(sheets), "장 (A3)"],
        ["총 페이지", fmt(pages), "쪽 (마스터 PDF)"],
        ["빌드 기간", shortRange(dates), dates.filter(function(v, i, a){ return a.indexOf(v) === i; }).length + "일 구간"]
      ].forEach(function(s){
        var box = el("div", "stat");
        box.appendChild(el("span", "k", s[0]));
        box.appendChild(el("span", s[1].length > 12 ? "v sm" : "v", s[1]));
        box.appendChild(el("span", "s", s[2]));
        summary.appendChild(box);
      });
      summary.hidden = false;

      return Promise.all(list.map(function(p){
        return p.pdf ? probe(pdfUrl(p.pdf)) : Promise.resolve(false);
      })).then(function(avail){
        grid.innerHTML = "";
        list.forEach(function(p, i){ grid.appendChild(card(p, avail[i])); });
      });
    })
    .catch(function(e){
      fail("projects.json 을 읽지 못했습니다 (" + e.message + "). 페이지를 서버에서 열어야 합니다.", "index.html", "← garage2AFH");
    });
})();
</script>
</body>
</html>
